name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Throwaway database for tests/test_dedup_sql.py (alerting.register_alert).
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://ci:ci-throwaway@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Node runs the JavaScript of the n8n Code nodes in tests/test_code_nodes.py
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate workflow JSON
        run: |
          for f in workflows/*.json; do
            python -m json.tool "$f" > /dev/null
            echo "valid JSON: $f"
          done
          python scripts/build_workflows.py --check

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Run tests
        run: pytest -v
