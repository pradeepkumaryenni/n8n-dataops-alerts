# Local demo stack: n8n + Postgres + Mailpit + a mock Slack/Jira receiver.
# Usage: cp .env.example .env && docker compose up -d --build
# Every port is bound to 127.0.0.1 only.

name: n8n-dataops-alerts

x-n8n-image: &n8n-image n8nio/n8n:2.45.7

x-n8n-env: &n8n-env
  # n8n's own database
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env (cp .env.example .env)}
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  # Defaults are a pool of 2 and a 20 s connect timeout; on a busy laptop that starved
  # workflow activation at startup, so give n8n more headroom.
  DB_POSTGRESDB_POOL_SIZE: "10"
  DB_POSTGRESDB_CONNECTION_TIMEOUT: "60000"
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
  GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Kolkata}
  TZ: ${GENERIC_TIMEZONE:-Asia/Kolkata}
  N8N_EDITOR_BASE_URL: http://localhost:5678
  N8N_WEBHOOK_URL: http://localhost:5678/
  N8N_SECURE_COOKIE: "false"                  # plain http on localhost only
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  # The workflows read non-secret settings with $env.*; secrets live in n8n credentials.
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
  # --- settings read by the workflows ($env.*) ---
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-http://mock-receiver:8000/slack/webhook}
  JIRA_BASE_URL: ${JIRA_BASE_URL:-http://mock-receiver:8000}
  JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-DATA}
  JIRA_ISSUE_TYPE: ${JIRA_ISSUE_TYPE:-Bug}
  ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-dataops-alerts@example.com}
  ONCALL_EMAIL_TO: ${ONCALL_EMAIL_TO:-oncall-data@example.com}
  DIGEST_EMAIL_TO: ${DIGEST_EMAIL_TO:-data-team@example.com}
  PLATFORM_EMAIL_TO: ${PLATFORM_EMAIL_TO:-data-platform@example.com}
  DEDUP_WINDOW_MINUTES: ${DEDUP_WINDOW_MINUTES:-15}
  LLM_API_BASE: ${LLM_API_BASE:-https://api.openai.com/v1}
  LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/schema:/schema:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      # TCP + a real query, so it only passes after the init scripts created the alert-log schema
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U $${POSTGRES_USER} -d dataops_alerts -tAc 'SELECT 1 FROM alerting.alert_log LIMIT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  mock-receiver:
    build: ./mock_receiver
    image: n8n-dataops-alerts/mock-receiver:local
    restart: unless-stopped
    environment:
      MOCK_LOG_FILE: /data/requests.jsonl
    volumes:
      - mock_data:/data
    ports:
      - "127.0.0.1:${MOCK_RECEIVER_PORT:-8000}:8000"

  # One-shot: imports credentials (rendered from env) and workflows, publishes them, then exits.
  n8n-import:
    image: *n8n-image
    restart: "no"
    entrypoint: ["/bin/sh", "/opt/dataops/n8n/import.sh"]
    environment:
      <<: *n8n-env
      ALERT_DB_HOST: postgres
      ALERT_DB_NAME: dataops_alerts
      ALERT_DB_USER: ${POSTGRES_USER}
      ALERT_DB_PASSWORD: ${POSTGRES_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_DISABLE_STARTTLS: ${SMTP_DISABLE_STARTTLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      JIRA_USER_EMAIL: ${JIRA_USER_EMAIL:?Set JIRA_USER_EMAIL in .env}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:?Set JIRA_API_TOKEN in .env}
      ALERT_WEBHOOK_USER: ${ALERT_WEBHOOK_USER:?Set ALERT_WEBHOOK_USER in .env}
      ALERT_WEBHOOK_PASSWORD: ${ALERT_WEBHOOK_PASSWORD:?Set ALERT_WEBHOOK_PASSWORD in .env}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/opt/dataops/workflows:ro
      - ./n8n:/opt/dataops/n8n:ro
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: *n8n-image
    restart: unless-stopped
    environment:
      <<: *n8n-env
      # Optional: pre-create the local owner account so the editor opens without the setup screen.
      # Webhooks and the CLI import work without it. See README "Open the editor".
      N8N_INSTANCE_OWNER_MANAGED_BY_ENV: ${N8N_INSTANCE_OWNER_MANAGED_BY_ENV:-false}
      N8N_INSTANCE_OWNER_EMAIL: ${N8N_INSTANCE_OWNER_EMAIL:-}
      N8N_INSTANCE_OWNER_FIRST_NAME: ${N8N_INSTANCE_OWNER_FIRST_NAME:-Local}
      N8N_INSTANCE_OWNER_LAST_NAME: ${N8N_INSTANCE_OWNER_LAST_NAME:-Owner}
      N8N_INSTANCE_OWNER_PASSWORD_HASH: ${N8N_INSTANCE_OWNER_PASSWORD_HASH:-}
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      n8n-import:
        condition: service_completed_successfully
      mock-receiver:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  pg_data:
  n8n_data:
  mock_data:
